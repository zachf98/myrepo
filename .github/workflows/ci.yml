name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      # Live tests are excluded: they depend on federal services being up, which
      # is not something a pull request should be blocked on.
      - name: Test
        run: pytest -m "not live" -q

      - name: Smoke test the CLI
        run: |
          ncscout sources
          ncscout scan --source fixtures --top 3 --prescreen 3 --formats md
          test -s reports/latest.md
